services:
  - type: web
    name: rent-room-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Points at an externally hosted Postgres (e.g. Supabase) — use the
      # direct connection string (port 5432), not the PgBouncer pooled one
      # (port 6543), so pg-boss's LISTEN/NOTIFY works.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: '900'
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: '604800'
      - key: R2_BUCKET
        sync: false
      - key: R2_PUB_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FRONT_END_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: ADMIN_TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      # Only needed to run `npx prisma db seed` once via the Render Shell —
      # not read by the running server.
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: LANDLORD_SEED_EMAIL
        sync: false
      - key: LANDLORD_SEED_PASSWORD
        sync: false
